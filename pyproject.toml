[project]
name = "polychat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nightfall" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
]

[tool.pyright]
typeCheckingMode = "basic"
extraPaths= ["src/polychat"]
# Add this block at the bottom:
[project.scripts]
client = "polychat.client:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
